# No fixed project name: Compose derives it from the checkout directory so two
# checkouts of this stack run as separate projects instead of fighting over
# the same containers and volumes.
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run ./scripts/up.sh first}
      MYSQL_DATABASE: ezyplatform
      MYSQL_USER: ezyplatform
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run ./scripts/up.sh first}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 60

  ezyplatform:
    image: ezyplatform-stack/core:1.6.0-1.5.6-84a5a5d
    platform: linux/amd64
    build:
      context: .upstream/ezyplatform-docker
      additional_contexts:
        "python:3.14-alpine": docker-image://${PYTHON_BASE_IMAGE:-python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67}
        "eclipse-temurin:11-jre": docker-image://${ECLIPSE_TEMURIN_BASE_IMAGE:-eclipse-temurin:11-jre@sha256:7db5776af2396377c8aae2aa124712da7b72a5b6b014c17d77ae37eb5276f37b}
      args:
        EZ_VERSION: "1.6.0"
        EZYARTICLE_VERSION: "1.5.6"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ezyplatform?permitMysqlScheme
      DB_USERNAME: ezyplatform
      DB_PASSWORD: ${MYSQL_PASSWORD:?Run ./scripts/up.sh first}
      AUTO_START_WEB: "true"
      STARTUP_TIMEOUT_SECONDS: "600"
    ports:
      - "127.0.0.1:${EZY_ADMIN_PORT:-9090}:9090"
      - "127.0.0.1:${EZY_WEB_PORT:-8080}:8080"
    volumes:
      - ezyplatform-data:/app/ezyplatform

volumes:
  mysql-data: {}
  ezyplatform-data: {}
