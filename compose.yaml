name: ezyplatform-stack
services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run ./scripts/up.sh first}
      MYSQL_DATABASE: ezyplatform
      MYSQL_USER: ezyplatform
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run ./scripts/up.sh first}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 60

  ezyplatform:
    image: ezyplatform-stack/core:1.5.9-1.5.6-84a5a5d
    platform: linux/amd64
    build:
      context: .upstream/ezyplatform-docker
      args:
        EZ_VERSION: "1.5.9"
        EZYARTICLE_VERSION: "1.5.6"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ezyplatform?permitMysqlScheme
      DB_USERNAME: ezyplatform
      DB_PASSWORD: ${MYSQL_PASSWORD:?Run ./scripts/up.sh first}
      AUTO_START_WEB: "true"
      STARTUP_TIMEOUT_SECONDS: "600"
    ports:
      - "127.0.0.1:${EZY_ADMIN_PORT:-9090}:9090"
      - "127.0.0.1:${EZY_WEB_PORT:-8080}:8080"
    volumes:
      - ezyplatform-data:/app/ezyplatform

volumes:
  mysql-data: {}
  ezyplatform-data: {}
